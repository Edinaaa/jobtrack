services:
  db:
    image: postgres:17
    container_name: jobtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack
      POSTGRES_DB: jobtrack
    ports:
      - "5432:5432"
    volumes:
      - jobtrack-db-data:/var/lib/postgresql/data

volumes:
  jobtrack-db-data: